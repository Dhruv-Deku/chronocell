name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (CPU PyTorch, exact versions)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          pip install -r requirements.lock
          pip install fastapi==0.141.1 uvicorn==0.52.1 httpx==0.28.1
      - name: chronocell/ has no Streamlit import
        run: |
          if grep -rnE '^\s*(import streamlit|from streamlit)' chronocell/; then exit 1; fi
      - name: Test suite
        run: python -m pytest -q -p no:cacheprovider
